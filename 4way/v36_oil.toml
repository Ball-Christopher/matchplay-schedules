# 36 players, 4 per lane pair, 35 weeks: every couple meets exactly 3 times.
# Oil-pattern blocks (consecutive weeks): 9 + 9 + 9 + 8 = 35 weeks.
#   block 1: weeks 1-9
#   block 2: weeks 10-18
#   block 3: weeks 19-27
#   block 4: weeks 28-35
# Lane pairs: exact (floor/ceil for every bowler); positions balanced. Worst prefix spread 2.
# Same-block repeat meetings: 0 (every couple meets on 3 different patterns). 4 patterns is the fewest possible: a clash-free run has at most 11 weeks and 3 x 11 < 35.
# Method: Four layers of GF(9) = GF(3)[i]. Each Hamilton cycle of K4 on the layers gives a 9-week pattern: the base week holds the four layer zeros and, on each directed cycle edge u->v, {+-1 in u, +-(1+i) in v} and {+-i in u, +-(2+i) in v}, translated by h in GF(9). The last 8 weeks are transversal: quartets h + s_j a with s = 0, 1, 2, i for each nonzero slope a. Lanes fitted by offsets. Found by Astra (another AI agent), 24 Nov 2026; checked independently in contrib/astra-2026-11-24b.
