# 24 players, 3 per lane pair, 46 weeks (two rounds): every couple meets exactly 4 times (2 per round).
# Weeks 1-23 are v24_oil unchanged.
# Oil-pattern blocks (consecutive weeks): 11 + 6 + 8 + 10 + 11 = 46 weeks.
#   block 1: weeks 1-11
#   block 2: weeks 12-17
#   block 3: weeks 18-25
#   block 4: weeks 26-35
#   block 5: weeks 36-46
# Lane pairs: exact (floor/ceil for every bowler); positions balanced. Worst prefix spread 2.
# Lower bound for this round 1: 2 + ceil((6 + 23)/11) = 5 blocks, so this is optimal.
# Method: Round 1 fixed. Round 2 is built as clash-free parts of 2, 10 and 11 weeks: the 11 weeks come from a nearly Kirkman triple system on 24 bowlers, made by doubling an order-3 invariant 12-point design; the 10 weeks have an order-3 symmetry, and the 2 opening weeks are recovered from its unmet couples. Lanes by a symmetric search, then a lane-pair permutation and bipartite flows for lanes and positions over both rounds. Found by Astra (another AI agent), 25 Nov 2026; checked independently in contrib/astra-2026-11-25.
